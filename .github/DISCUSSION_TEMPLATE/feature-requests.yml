title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: |
        One idea per post, please. Search first: if someone already asked, upvote it and add your case in a comment.
        Posts here are public: don't include emails, passwords or other personal data.
  - type: dropdown
    id: area
    attributes:
      label: Which part of Any Takers?
      options:
        - Ideas & posting
        - Matching
        - Requests & teams
        - Kickoff & GitHub
        - Team pages & rankings
        - Badges & grades
        - Profile
        - Notifications
        - Ads
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution yet.
      placeholder: "When I post a prototype, I can't tell whether…"
    validations:
      required: true
  - type: dropdown
    id: who
    attributes:
      label: Who has this problem?
      multiple: true
      options:
        - People posting an idea or prototype
        - People looking for a project to join
        - Teams already building
        - Visitors browsing
        - Everyone
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you handle it today?
      description: A workaround, another tool, or "I just can't".
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
      description: Your idea for a solution. Rough is fine.
    validations:
      required: true
